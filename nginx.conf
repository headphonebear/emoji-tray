# emoji-tray — nginx server block (replaces the image's default.conf).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    charset_types application/json text/css application/javascript;

    # The page talks to nobody but itself. Same policy as the <meta> tag in
    # index.html, sent as a header too so it also covers the JSON responses.
    # NB: nginx only inherits add_header into a location that sets NONE of
    # its own — that's why the locations below repeat the security headers.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    # Liveness/readiness for Docker and Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Your own config can change at any time (e.g. a Kubernetes ConfigMap) —
    # always revalidate. A missing config.json is normal: the app falls back
    # to config.default.json, so don't log that 404.
    location ~ ^/config(\.default)?\.json$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        log_not_found off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri $uri/ =404;
    }
}
