<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Everything is served from this origin. No CDNs, no fonts, no analytics:
       the emoji pictures come from the visitor's own system font. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>emoji-tray</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="emoji-tray, back to top">
      <span class="brand-mark" aria-hidden="true">🐻</span>
      <span class="brand-name">emoji-tray</span>
    </a>

    <div class="search">
      <label class="visually-hidden" for="q">Search emojis</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search · Suche · Поиск   ( / )">
    </div>

    <div class="controls">
      <div class="tones" role="radiogroup" aria-label="Skin tone">
        <!-- filled by app.js: default yellow + five skin tones -->
      </div>
      <button class="theme-toggle" type="button" aria-label="Colour theme">
        <span aria-hidden="true">◐</span><span class="theme-label">auto</span>
      </button>
    </div>
  </header>

  <div class="layout" id="top">
    <nav class="sidenav" aria-label="Emoji groups">
      <!-- filled by app.js -->
    </nav>

    <main class="content">
      <p class="loading" role="status">Loading emojis…</p>

      <section class="results" id="results" hidden aria-live="polite">
        <h2 class="section-title"><span class="results-count"></span></h2>
        <div class="grid"></div>
      </section>

      <div class="groups"><!-- filled by app.js --></div>

      <footer class="footer">
        <p>
          Click an emoji to copy it · right-click for other skin tones ·
          <span class="data-version"></span>
        </p>
        <p>
          No tracking, no ads, no third-party anything. Emoji data © Unicode, Inc.
          (Unicode License v3) · code MIT ·
          <a href="https://github.com/headphonebear/emoji-tray">source</a>
        </p>
      </footer>
    </main>
  </div>

  <div class="toast" role="status" aria-live="polite" hidden></div>

  <div class="popover" role="dialog" aria-label="Pick a skin tone" hidden>
    <div class="popover-grid"></div>
  </div>
</body>
</html>
